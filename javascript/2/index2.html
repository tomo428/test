<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<from>
    <select name="age">
        <option>選択してください</option>
        <script>
            for (var i = 18; i <= 65; i ++) {
                document.write("<option>");
                document.write(i);
                document.write("</option>");
            }
        </script>
    </select>
</from>

</body>
</html>
